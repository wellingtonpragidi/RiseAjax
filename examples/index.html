<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Rise</title>
</head>
<body>

    <h1>Exemplo básico para envio de formulário com <code>Rise()</code></h1>

    <form id="myForm" method="POST" action="">
    	<input type="text" name="name" />
    	<input type="date" name="date" />
    	<button id="btn-submit" type="submit" name="submit">Atualizar</button>
    	<div id="result"></div>
    </form>

<script src="../assets/js/rise-ajax.js"></script>
<script>
Rise.form('#myForm', {
	url: 'controller.php',
	success: (callback) => {
		var result = JSON.parse(callback);
		var show = result.text + result.name + result.date;
		document.getElementById('result').innerHTML = show;
		Rise.appear('#result').disappear('#result', 3000);
		Rise.clearFields();
	},
	error: (err) => {
		console.error( 'Erro:', err );
	},
});
</script>
</body>
</html>
